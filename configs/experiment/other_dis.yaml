# @package _global_

# to execute this experiment run:
# python train.py experiment=other_dis datamodule=musdb_dev14

defaults:
  - multigpu_default
  - override /model: other.yaml

seed: 2021
train_steps: 200000  # 四种模式共用，看测试结果前冻结

exp_name: ${model.target_name}_g${model.g}_${fusion_tag:${model.mr_frontend.enabled},${model.mr_frontend.fusion_mode}}_s${seed}

# the name inside project
logger:
  wandb:
    name: ${exp_name}

model:
  lr: 0.0002
  optimizer: adamW
  bn_norm: syncBN
  audio_ch: 2 # datamodule.single_channel
  g: 16

trainer:
  devices: 2 # int or list
  sync_batchnorm: True
  track_grad_norm: 2
#  gradient_clip_val: 5

datamodule:
  batch_size: 8
  num_workers: ${oc.decode:${oc.env:NUM_WORKERS}}
  pin_memory: False
  overlap: ${model.overlap}
  audio_ch: ${model.audio_ch}
  epoch_size:
