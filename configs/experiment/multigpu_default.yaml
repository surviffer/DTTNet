# @package _global_

# to execute this experiment run:
# 由各 *_dis.yaml 继承，不单独使用

defaults:
  - override /callbacks: default
  - override /logger:
    - wandb
    - tensorboard


#callbacks:
#  early_stopping:
#    patience: 1000000

#datamodule:
#  external_datasets:
#    - test

trainer:
  # 训练长度只由 train_steps 决定（优化器步数）
  max_epochs: -1
  max_steps: ${train_steps}
  accelerator: cuda
  amp_backend: native
  precision: 16
  track_grad_norm: -1