_target_: src.dp_tdf.dp_tdf_net.DPTDFNet

# abstract parent class
target_name: 'drums'
lr: 0.0001
optimizer: adamW
weight_decay: 0.01  # AdamW 权重衰减（bias/BN/static_logits/fusion_scale 不衰减）

dim_f: 2048
dim_t: 256
n_fft: 6144
n_fft_short: 4096
n_fft_long: 8192
hop_length: 1024
overlap: 3072

audio_ch: 2

block_type: TFC_TDF_Res2
num_blocks: 5
l: 3
g: 16
k: 3
bn: 8
bias: False
bn_norm: BN
bandsequence:
  rnn_type: LSTM
  bidirectional: True
  num_layers: 2
  n_heads: 2

mr_frontend:
  enabled: true  # false 即 Baseline（只用中窗 STFT）
  fusion_mode: dynamic  # fixed | learned_static | dynamic | mid_only
  fusion_scale_init: 0.1  # 从预训练 baseline 微调时设为 0
  num_branch_layers: 2  #每一路分支两层卷积块
  weight_hidden_dim: 128  #权重网络隐藏层128
